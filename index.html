<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>TRVE (Base) vs Moyenne marché — Heures creuses • 6 kVA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;overflow:hidden;background:#fff;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:40px 16px;}
    .chart-wrapper{background:transparent;border-radius:0;box-shadow:none;padding:0;width:100%;max-width:900px;}
    h1{margin:0 0 14px;text-align:center;font-size:22px;font-weight:600;color:#0b0f19;}
    .legend-note{margin:2px 0 12px;text-align:center;color:#64748b;font-size:13px;}
    canvas{width:100% !important;height:auto !important;}
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>Évolution du prix du kWh — TRVE vs Offres de marché</h1>
    <div class="legend-note">Profil particulier • Offre (Heures Creuses) • <strong>6 kVA</strong> • Unités : €/kWh <strong>TTC</strong></div>
    <canvas id="chart"></canvas>
  </div>

  <script>
    // 👇 Remplace "TON_REPO_HC" par le nom de ton repo GitHub pour les données HC
    const REPO = "FEPPN/competitors-hc-kwh-graph";

    const trveUrl        = `https://cdn.jsdelivr.net/gh/${REPO}@main/data/data_TRVE_HC.csv`;
    const competitorsUrl = `https://cdn.jsdelivr.net/gh/${REPO}@main/data/data_competitors_HC.csv`;

    const START_AT = "2024-07";
    const currentDate = new Date();
    const END_AT = currentDate.getFullYear() + "-" + String(currentDate.getMonth() + 1).padStart(2, "0");

    const ymKey = d => { const dt=new Date(d); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"); };
    const ymToLabel = k => { const [y,m]=k.split("-"); return new Date(+y,+m-1,1).toLocaleDateString("fr-FR",{year:"numeric",month:"2-digit"}); };

    function monthRange(startYm, endYm){
      const [sy, sm] = startYm.split("-").map(Number);
      const [ey, em] = endYm.split("-").map(Number);
      const res = []; let y = sy, m = sm;
      while (y < ey || (y === ey && m <= em)) {
        res.push(y + "-" + String(m).padStart(2,"0"));
        m++; if (m > 12) { m = 1; y++; }
      }
      return res;
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length < 2) return [];
      const delimiter = lines[0].includes(';') ? ';' : ',';
      const headers = lines[0].split(delimiter).map(h => h.trim().replace(/^["']|["']$/g, ''));
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        const rowText = lines[i].trim();
        if (!rowText) continue;
        const cols = rowText.split(delimiter).map(c => c.trim().replace(/^["']|["']$/g, ''));
        const rowObj = {};
        headers.forEach((h, idx) => { rowObj[h] = cols[idx]; });
        result.push(rowObj);
      }
      return result;
    }

    Promise.all([
      fetch(trveUrl+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()),
      fetch(competitorsUrl+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.text())
    ])
    .then(([trveCsvText, compCsvText])=>{
      const trveRows = parseCSV(trveCsvText);
      const compRows = parseCSV(compCsvText);

      // TRVE — supporte DATE_DEBUT ou Date, et colonne HC ou BASE
      const trvePoints = (trveRows || [])
        .filter(r => (r.DATE_DEBUT || r.Date) && (r.PART_VARIABLE_HC_TTC || r.HC || r.BASE) !== undefined)
        .map(r => {
          const dateKey = r.DATE_DEBUT || r.Date;
          const rawVal  = r.PART_VARIABLE_HC_TTC || r.HC || r.BASE;
          const val = Number(String(rawVal).replace(",", "."));
          return [ymKey(dateKey), val];
        })
        .filter(r => !Number.isNaN(r[1]))
        .sort((a,b) => a[0].localeCompare(b[0]));

      const months = monthRange(START_AT, END_AT);

      const valueAtMonth = (k) => {
        let last = null;
        for (const [kk, vv] of trvePoints) { if (kk <= k) last = vv; else break; }
        return last;
      };

      const labels   = months.map(ymToLabel);
      const trveVals = months.map(valueAtMonth);

      // Concurrents HC — supporte CompetitorAVG_HC ou CompetitorAVG
      const compIdx = {};
      (compRows || []).forEach(r => {
        const dateKey = r.DATE_DEBUT || r.Date;
        const rawVal  = r.CompetitorAVG_HC || r.CompetitorAVG;
        const v = Number(String(rawVal).replace(",", "."));
        if (!Number.isNaN(v) && dateKey) compIdx[ymKey(dateKey)] = v;
      });
      const compVals = months.map(k => (k in compIdx ? compIdx[k] : null));

      const ctx = document.getElementById("chart").getContext("2d");
      const gTrve = ctx.createLinearGradient(0,0,0,300);
      gTrve.addColorStop(0,"rgba(90, 82, 255, 0.22)");
      gTrve.addColorStop(1,"rgba(90, 82, 255, 0.00)");

      new Chart(ctx,{
        type:'line',
        data:{
          labels,
          datasets:[
            {
              label:"TRVE – Tarif réglementé HC (6 kVA)",
              data: trveVals,
              borderColor:"#5a52ff",
              backgroundColor:gTrve,
              borderWidth:1.6,
              pointRadius:0,
              spanGaps:true,
              stepped:'before',
              tension:0,
              fill:false
            },
            {
              label:"Prix moyen offres de marché HC (Engie • TotalEnergies • OHM Énergie • Primeo Énergie)",
              data: compVals,
              borderColor:"#334155",
              backgroundColor:"transparent",
              borderWidth:1.6,
              borderDash:[6,4],
              pointRadius:0,
              spanGaps:true,
              stepped:false,
              tension:0.25,
              fill:false
            }
          ]
        },
        options:{
          responsive:true,
          interaction:{ mode:'nearest', intersect:false },
          plugins:{
            legend:{ position:"bottom", labels:{ color:"#1f2937", font:{ size:13, weight:"600" } } },
            tooltip:{
              backgroundColor:"#fff", borderColor:"#e5e7eb", borderWidth:1,
              titleColor:"#111827", bodyColor:"#4b5563",
              titleFont:{ weight:'700' }, bodyFont:{ weight:'500' },
              padding:10, cornerRadius:10,
              callbacks:{
                label:(ctx)=>{
                  const y = ctx.parsed.y;
                  if (typeof y !== "number") return `${ctx.dataset.label} : —`;
                  return `${ctx.dataset.label} : ${y.toFixed(4).replace('.',',')} € / kWh TTC`;
                }
              }
            }
          },
          scales:{
            y:{
              min:0.1,
              ticks:{ color:"#6b7280", callback:v=>`${Number(v).toFixed(3).replace('.',',')} €` },
              grid:{ color:"rgba(0,0,0,0.06)" },
              border:{ display:false }
            },
            x:{
              offset:true,
              ticks:{ color:"#6b7280", maxRotation:0, autoSkip:true, maxTicksLimit:12 },
              grid:{ display:false },
              border:{ display:false }
            }
          }
        }
      });
    })
    .catch(err=>{
      console.error(err);
      document.querySelector(".chart-wrapper").insertAdjacentHTML("beforeend",
        `<p style="margin-top:10px;color:#ef4444;text-align:center">Erreur de chargement des données.</p>`);
    });
  </script>
</body>
</html>
